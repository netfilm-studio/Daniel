<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Для тебя</title>
<meta name="theme-color" content="#1a0d10"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1a0d10;--bg2:#2a1216;--paper:#fbf4ee;--paper2:#f3e6dc;--ink:#3a2420;--red:#c62828;--rose:#e57373;--gold:#d9b47a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{min-height:100%}
body{background:radial-gradient(110% 80% at 50% 20%,#3a171c 0%,var(--bg2) 40%,var(--bg) 100%) fixed;color:#fff;font-family:Inter,system-ui,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
body.scroll{overflow-y:auto}

/* звёзды и лепестки */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw ease-in-out infinite}
@keyframes tw{50%{opacity:.08}}
.petal{position:fixed;top:-30px;z-index:1;pointer-events:none;color:var(--rose);opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}

/* ── открытка ── */
.scene{position:relative;z-index:2;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:16px;
  transition:opacity .8s}
.book{position:relative;width:min(330px,78vw);aspect-ratio:3/4.2;perspective:1800px;transition:transform 1.2s cubic-bezier(.3,.8,.2,1)}
.inside,.cover{position:absolute;inset:0;border-radius:6px 14px 14px 6px}
.inside{background:linear-gradient(135deg,var(--paper),var(--paper2));box-shadow:0 30px 70px -20px rgba(0,0,0,.7);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;text-align:center}
.inside .heart{font-size:44px;color:var(--red);animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.inside .ln{font-family:'Marck Script',cursive;font-size:clamp(26px,8vw,34px);line-height:1.25;margin-top:14px}
.inside small{display:block;margin-top:16px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#8a6a62}
.cover{transform-origin:left center;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.6,.05,.25,1);cursor:pointer;z-index:3}
.cover .face,.cover .back{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.cover .face{background:#7d1c1f;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
.cover .face img{position:absolute;inset:14px 14px 92px;width:calc(100% - 28px);height:calc(100% - 106px);object-fit:cover;border-radius:4px;filter:saturate(.95)}
.cover .face .title{position:absolute;left:0;right:12%;bottom:22px;text-align:center;font-family:'Marck Script',cursive;font-size:38px;color:#fbe9e0}
.cover .face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.cover .back{transform:rotateY(180deg);background:linear-gradient(225deg,var(--paper),var(--paper2))}
.cover .back img{position:absolute;left:14%;right:14%;top:12%;height:62%;width:72%;object-fit:cover;border:8px solid #fff;border-bottom-width:30px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);transform:rotate(-3deg)}
.cover .back span{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:'Marck Script',cursive;font-size:24px;color:var(--red)}
.ribbon{position:absolute;top:0;bottom:0;right:10%;width:22px;background:linear-gradient(90deg,#b8894a,#e3c38a,#b8894a);z-index:4;pointer-events:none;transition:opacity .4s, transform .6s}
.bow{position:absolute;right:calc(10% - 27px);top:44%;width:76px;height:52px;z-index:5;pointer-events:none;transition:opacity .4s,transform .6s}
.book.open .ribbon,.book.open .bow{opacity:0;transform:translateY(-30px) scale(.8)}
.book.open .cover{transform:rotateY(-165deg)}
.book.open{transform:translateX(min(160px,38vw))}
@media (max-width:700px){.book.open{transform:translateX(0)} .book.open .cover{transform:rotateY(-180deg) translateZ(1px);opacity:0;transition:transform 1.6s cubic-bezier(.6,.05,.25,1),opacity .5s 1.2s}}
.hint{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:10px;transition:opacity .4s}
.hint i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.9);opacity:.3}}
.top-note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:rgba(255,255,255,.75)}

/* ── письмо и фото после открытия ── */
.story{position:relative;z-index:2;display:none}
.story.show{display:block}
.block{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center}
.letter{max-width:520px;width:100%;background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--ink);border-radius:18px;padding:34px 26px 30px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8);text-align:left;position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(198,40,40,.18);border-radius:12px;pointer-events:none}
.letter h2{font-family:'Marck Script',cursive;font-weight:400;font-size:36px;color:var(--red);margin-bottom:12px}
.letter .txt{font-family:'Marck Script',cursive;font-size:clamp(22px,6vw,26px);line-height:1.45;min-height:12em;white-space:pre-wrap}
.letter .txt .cur{display:inline-block;width:2px;height:1em;background:var(--red);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter .sig{margin-top:18px;text-align:right;font-family:'Marck Script',cursive;font-size:28px;color:var(--red);opacity:0;transition:opacity 1s}
.letter .sig.in{opacity:1}

.photo-hero{position:relative;width:min(520px,100%);aspect-ratio:3/4;border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9)}
.photo-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.12);transition:opacity 1.6s,transform 7s linear}
.photo-hero img.on{opacity:1;transform:scale(1)}
.photo-hero .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 20px 22px;background:linear-gradient(transparent,rgba(0,0,0,.65));
  font-family:'Marck Script',cursive;font-size:clamp(26px,7vw,34px);text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .4s,transform .4s}
.dots b.on{background:var(--rose);transform:scale(1.3)}

.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(24px,6.5vw,32px);line-height:1.4;max-width:520px;color:#fbe9e0}
.quote b{color:var(--rose);font-weight:500}
.scatter{position:relative;width:min(520px,100%);height:clamp(380px,110vw,520px);margin-top:36px}
.pola{position:absolute;background:#fff;padding:8px 8px 30px;border-radius:3px;box-shadow:0 18px 36px -14px rgba(0,0,0,.8);
  opacity:0;transform:translateY(60px) rotate(0) scale(.85);transition:opacity .8s,transform 1s cubic-bezier(.2,.9,.25,1.2)}
.pola img{display:block;width:100%;height:100%;object-fit:cover}
.scatter.in .pola{opacity:1}
.q1{width:48%;height:50%;left:0;top:2%} .scatter.in .q1{transform:rotate(-8deg)}
.q2{width:46%;height:46%;right:0;top:8%;transition-delay:.2s} .scatter.in .q2{transform:rotate(7deg)}
.q3{width:50%;height:48%;left:25%;bottom:0;z-index:2;transition-delay:.4s} .scatter.in .q3{transform:rotate(-2deg)}

.final{min-height:100svh}
.big-heart{font-size:clamp(90px,28vw,150px);color:var(--red);cursor:pointer;animation:beat 1.3s infinite;filter:drop-shadow(0 10px 30px rgba(198,40,40,.6));user-select:none}
.love{font-family:'Marck Script',cursive;font-size:clamp(44px,13vw,72px);margin-top:10px}
.love-sub{margin-top:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:rgba(255,255,255,.7)}
.tapme{margin-top:26px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s,transform 1s}
.reveal.in{opacity:1;transform:none}
.burst{position:fixed;z-index:9;pointer-events:none;animation:burst 1.8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.5);opacity:0}}
.music{position:fixed;right:16px;top:16px;z-index:8;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35);color:#fff;font-size:18px;display:none;backdrop-filter:blur(6px)}
.music.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<button class="music" id="music" aria-label="Музыка">♫</button>

<section class="scene" id="scene">
  <div class="top-note">Таисия, это тебе</div>
  <div class="book" id="book" role="button" aria-label="Открыть открытку">
    <div class="inside">
      <div class="heart">♥</div>
      <div class="ln">Я тебя очень<br/>сильно люблю</div>
      <small>листай дальше…</small>
    </div>
    <div class="cover">
      <div class="face"><img src="../card/img/rocks.jpg" alt=""/><div class="title">Для тебя</div></div>
      <div class="back"><img src="../card/img/forehead.jpg" alt=""/><span>моя любовь</span></div>
    </div>
    <div class="ribbon"></div>
    <svg class="bow" viewBox="0 0 76 52"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b8894a"/><stop offset=".5" stop-color="#ecd09a"/><stop offset="1" stop-color="#b8894a"/></linearGradient></defs>
      <path d="M38 26 C20 4 0 8 6 26 C0 44 20 48 38 26Z" fill="url(#g)"/><path d="M38 26 C56 4 76 8 70 26 C76 44 56 48 38 26Z" fill="url(#g)"/>
      <path d="M34 26 L24 52 L32 50 L38 30 L44 50 L52 52 L42 26Z" fill="#c9a062"/><circle cx="38" cy="26" r="7" fill="#d9b47a"/></svg>
  </div>
  <div class="hint" id="hint"><i></i>нажми на открытку</div>
</section>

<main class="story" id="story">
  <section class="block">
    <div class="letter">
      <h2>Моя Таисия,</h2>
      <div class="txt" id="txt"></div>
      <div class="sig" id="sig">твой Даниель ♥</div>
    </div>
  </section>

  <section class="block">
    <div class="photo-hero reveal" id="slides">
      <img src="../card/img/forehead.jpg" alt="" class="on"/>
      <img src="../card/img/kiss.jpg" alt=""/>
      <img src="../card/img/hero.jpg" alt=""/>
      <img src="../card/img/cafe.jpg" alt=""/>
      <img src="../card/img/shoe.jpg" alt=""/>
      <div class="cap" id="cap">ты — мой самый любимый человек</div>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="block">
    <div class="quote reveal">С тобой даже самый обычный день<br/>становится <b>лучшим днём в жизни</b></div>
    <div class="scatter reveal" id="scatter">
      <figure class="pola q1"><img src="../card/img/snow.jpg" alt=""/></figure>
      <figure class="pola q2"><img src="../card/img/legs.jpg" alt=""/></figure>
      <figure class="pola q3"><img src="../card/img/rocks.jpg" alt=""/></figure>
    </div>
  </section>

  <section class="block final">
    <div class="big-heart reveal" id="heart">♥</div>
    <div class="love reveal">Я люблю тебя</div>
    <div class="love-sub reveal">сегодня, завтра и всегда</div>
    <div class="tapme reveal">нажми на сердце</div>
  </section>
</main>

<audio id="song" src="../media/song.mp3" preload="none" loop></audio>

<script>
(function(){
  // звёзды и падающие лепестки
  const sky=document.getElementById('sky'); let s='';
  for(let i=0;i<60;i++) s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${-Math.random()*5}s"></i>`;
  sky.innerHTML=s;
  for(let i=0;i<14;i++){const p=document.createElement('span');p.className='petal';p.textContent=['♥','❀','♥'][i%3];
    p.style.left=Math.random()*100+'%';p.style.fontSize=(10+Math.random()*16)+'px';p.style.animationDuration=(9+Math.random()*10)+'s';
    p.style.animationDelay=(-Math.random()*18)+'s';p.style.setProperty('--x',(Math.random()*120-60)+'px');p.style.setProperty('--r',(Math.random()*360)+'deg');
    document.body.appendChild(p);}

  const book=document.getElementById('book'), scene=document.getElementById('scene'), story=document.getElementById('story');
  const song=document.getElementById('song'), mbtn=document.getElementById('music');
  let opened=false;

  function burst(x,y,n){
    for(let i=0;i<n;i++){const e=document.createElement('span');e.className='burst';e.textContent=['♥','💗','💖','✨','❤️'][i%5];
      const a=Math.random()*Math.PI*2,d=80+Math.random()*200;
      e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(14+Math.random()*20)+'px';
      e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d-80+'px');e.style.setProperty('--r',(Math.random()*140-70)+'deg');
      document.body.appendChild(e);setTimeout(()=>e.remove(),1900);}
  }
  function music(){try{song.volume=0;song.play().then(()=>{mbtn.classList.add('on');let v=0;const t=setInterval(()=>{v=Math.min(.35,v+.02);song.volume=v;if(v>=.35)clearInterval(t)},120)}).catch(()=>{})}catch(e){}}
  mbtn.onclick=()=>{if(song.paused){song.play();mbtn.textContent='♫'}else{song.pause();mbtn.textContent='♪'}};

  // письмо печатается от руки
  const LETTER=[
    'Я тебя очень сильно люблю.',
    'Ты — самое прекрасное, что когда-либо со мной случалось.',
    'Рядом с тобой я становлюсь лучше. Твоя улыбка — мой любимый вид, твой голос — моя любимая песня, а твои объятия — моё самое тёплое место на земле.',
    'Спасибо, что ты есть. Спасибо, что выбираешь меня каждый день.',
    'Я хочу просыпаться с тобой, смеяться с тобой, путешествовать с тобой и держать тебя за руку, что бы ни случилось.',
    'Ты — мой дом.'
  ].join('\n\n');
  function typeLetter(){
    const el=document.getElementById('txt'); let i=0;
    const step=()=>{ i++; el.innerHTML=LETTER.slice(0,i).replace(/</g,'&lt;')+'<span class="cur"></span>';
      if(i<LETTER.length){ const ch=LETTER[i-1]; setTimeout(step, ch==='\n'?260:(/[.,—]/.test(ch)?180:38)); }
      else { el.innerHTML=LETTER.replace(/</g,'&lt;'); document.getElementById('sig').classList.add('in'); } };
    step();
  }

  book.addEventListener('click',()=>{
    if(opened) return; opened=true;
    const r=book.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,26);
    book.classList.add('open'); document.getElementById('hint').style.opacity=0; music();
    setTimeout(()=>{ burst(innerWidth/2,innerHeight/2,18); },1700);
    setTimeout(()=>{ scene.style.opacity=0; },3600);
    setTimeout(()=>{ scene.style.display='none'; story.classList.add('show'); document.body.classList.add('scroll'); scrollTo(0,0); typeLetter(); observe(); },4300);
  });

  // слайд-шоу
  const imgs=[...document.querySelectorAll('#slides img')], caps=['ты — мой самый любимый человек','держи меня за руку всегда','с тобой спокойно и тепло','мне хорошо просто рядом с тобой','я всегда буду заботиться о тебе'];
  const dots=document.getElementById('dots'); dots.innerHTML=imgs.map((_,k)=>`<b class="${k?'':'on'}"></b>`).join('');
  let cur=0; setInterval(()=>{ if(!story.classList.contains('show')) return;
    imgs[cur].classList.remove('on'); dots.children[cur].classList.remove('on'); cur=(cur+1)%imgs.length;
    imgs[cur].classList.add('on'); dots.children[cur].classList.add('on'); document.getElementById('cap').textContent=caps[cur]; },4200);

  function observe(){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  }
  document.getElementById('heart').addEventListener('click',e=>burst(e.clientX,e.clientY,34));
})();
</script>
</body>
</html>
